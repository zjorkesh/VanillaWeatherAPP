<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous"
    />
    <script src="https://unpkg.com/axios@1.13.2/dist/axios.min.js"></script>
    <link rel="stylesheet" href="src/style.css" />

    <title>Vanilla-Weather-APP</title>
  </head>
  <body>
    <div class="container">
      <div class="weather-wrapper">
        <form id="search-form" class="mb-4">
          <div class="row">
            <div class="col-9">
              <input
                type="search"
                placeholder="Enter a city..."
                class="input-form"
                id="city-input"
              />
            </div>
            <div class="col-2">
              <input type="submit" value="Search" class="btn btn-primary" />
            </div>
          </div>
        </form>
        <hr>
        <h1 id="city"></h1>
        <h2 id="date"></h2>
        <div class="row">
          <div class="col-6">
           <div class="temperature-container">
            <img src="" alt="" id="icon" />

            <span id="temperature"></span>
            <span class="temperature-units">°C | °F</span>
           </div>

           <div class="feel-temperature">
                <span>Feels like </span><span id="feels-temperature"></span><span><sup>°C</sup></span>
           </div>
          </div>

          <div class="col-6">
            <ul class="condition">
              <li id="description"></li>
              <li>humidity: <span id="humidity"></span>%</li>
              <li>Wind: <span id="wind-speed"></span> km/h</li>
            </ul>
          </div>
        </div>
      <hr />
      <div class="host">
        <small>
          This project was coded by <a href="https://www.shecodes.io/graduates/25647-zeinab-jorkesh"  class="coder"id="name" target="_blank">Zeinab Jorkesh</a> and is on <a href="" class="coder" id="github" target="_blank">GitHub</a> and hosted on <a href="" class="coder" id="netlify" target="_blank">Netlify</a>.
        </small>
      </div>
        </small>
      </div>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
