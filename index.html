<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous"
    />
    <script src="https://unpkg.com/axios@1.13.2/dist/axios.min.js"></script>
    <link rel="stylesheet" href="src/style.css" />

    <title>Vanilla-Weather-APP</title>
  </head>
  <body>
    <div class="container">
      <div class="weather-wrapper">
        <h1 id="city"></h1>
        <h2 id="date"></h2>
        <div class="row">
          <div class="col-6 temperature-container">
            <img src="" alt="" id="icon" />

            <span id="temperature"> </span>
            <span class="temperature-units">°C | °F</span>
          </div>
          <div class="col-6">
            <ul class="condition">
              <li id="description">Partly sunny</li>
              <li>humidity: <span id="humidity"></span>%</li>
              <li>Wind: <span id="wind-speed"></span> km/h</li>
            </ul>
          </div>
        </div>
      </div>
      <hr />
      <div class="coder">
        <small>
          Coded by
          <a href="https://github.com/zjorkesh" target="_blank">Zeinab</a>
        </small>
      </div>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
