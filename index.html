<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="src/style.css" />

    <title>Vanilla-Weather-APP</title>
  </head>
  <body>
    <div class="container">
      <div class="weather-wrapper">
        <h1 class="city">Tehran</h1>
        <h2 class="date">Wednesday 14:53</h2>
        <div class="row">
          <div class="cul-6">
            <img
              src="https://th.bing.com/th/id/OBWA.v6-106-png-d200?w=72&h=72&c=6&o=6&dpr=2&pid=Weather"
              alt=""
            />
            <span class="temperature"> 30 °C | °F </span>
          </div>
          <div class="cul-6">
            <ul>
              <li class="condition">Partly sunny</li>
              <li class="humidity">humidity: 50%</li>
              <li class="wind">Wind: 20 km/h</li>
            </ul>
          </div>
        </div>
      </div>
      <hr />
      <div class="coder">
        <small>
          Coded by
          <a href="https://github.com/zjorkesh" target="_blank">Zeinab</a>
        </small>
      </div>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
